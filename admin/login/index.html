<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin login for restaurant management panel.">
  <meta name="theme-color" content="#0f1117">
  <title>Admin Login — WIN Restaurant</title>

  <!-- PWA Meta Tags & Manifest -->
  <link rel="manifest" href="../../manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WIN Restaurant">
  <link rel="apple-touch-icon" href="../../icons/icon-512.png">

  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo"><i class="fa-solid fa-lock"></i></div>
      <h1>Admin Login</h1>
      <p class="subtitle">Enter your password to access the dashboard</p>

      <form class="login-form" id="login-form">
        <div class="login-error" id="login-error">Invalid password. Please try again.</div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-input" id="password" placeholder="Enter admin password" required autofocus>
        </div>
        <button type="submit" class="btn btn--primary btn--full btn--lg" id="login-btn">
          Sign In
        </button>
      </form>

      <p style="margin-top: var(--sp-6); font-size: var(--fs-xs); color: var(--clr-text-muted);">
        <a href="../../" style="color: var(--clr-text-muted);">← Back to Home</a>
      </p>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script>
    // Check if already logged in
    if (sessionStorage.getItem(CONFIG.STORAGE_KEYS.AUTH)) {
      window.location.href = '../';
    }

    // Fetch config silently to update the brand name on the login screen
    API.getConfig().then(() => {
      if (typeof window.applyBrandSettings === 'function') {
        window.applyBrandSettings();
      }
    }).catch(console.error);

    const form = document.getElementById('login-form');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('login-btn');
    const errorEl = document.getElementById('login-error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = passwordInput.value.trim();
      if (!password) return;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';
      errorEl.style.display = 'none';

      try {
        const result = await API.login(password);
        sessionStorage.setItem(CONFIG.STORAGE_KEYS.AUTH, 'true');
        sessionStorage.setItem('restaurant_name', result.restaurant || 'WIN Restaurant');
        localStorage.setItem('app_restaurant_name', result.restaurant || 'WIN Restaurant');
        window.location.href = '../';
      } catch (err) {
        errorEl.style.display = 'block';
        passwordInput.value = '';
        passwordInput.focus();
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    });
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../../sw.js', { scope: '../../' })
          .then(reg => console.log('Service Worker registered successfully.', reg.scope))
          .catch(err => console.log('Service Worker registration failed.', err));
      });
    }
  </script>
</body>
</html>
