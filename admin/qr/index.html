<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Codes — Admin Panel</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .qr-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--sp-4);
    }
    .qr-controls {
      display: flex;
      gap: var(--sp-3);
      align-items: center;
      background: var(--clr-bg-elevated);
      padding: var(--sp-3);
      border-radius: var(--radius-md);
      margin-bottom: var(--sp-4);
    }
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: var(--sp-4);
    }
    .qr-card {
      background: var(--clr-bg-elevated);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-md);
      padding: var(--sp-4);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .qr-card h3 {
      margin-top: 0;
      margin-bottom: var(--sp-3);
      font-size: var(--fs-md);
    }
    .qr-code {
      display: flex;
      justify-content: center;
      background: #fff;
      padding: var(--sp-2);
      border-radius: var(--radius-sm);
      margin-bottom: var(--sp-3);
    }
    @media print {
      body * {
        visibility: hidden;
      }
      .qr-grid, .qr-grid * {
        visibility: visible;
      }
      .qr-grid {
        position: absolute;
        left: 0;
        top: 0;
        grid-template-columns: repeat(3, 1fr);
        width: 100%;
        gap: 20px;
      }
      .qr-card {
        border: 2px dashed #ccc;
        page-break-inside: avoid;
        color: #000;
        background: #fff;
      }
      .qr-card h3 {
        color: #000;
      }
    }
    @media (max-width: 600px) {
      .qr-controls {
        flex-direction: column;
        align-items: stretch;
      }
      .qr-controls .form-group {
        width: 100% !important;
      }
      .qr-controls .btn {
        align-self: stretch !important;
      }
    }
  </style>
  <!-- Load QRCode library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand"><i class="fa-solid fa-utensils"></i> WIN Restaurant</div>
        <div class="sidebar-subtitle">Admin Panel</div>
      </div>
      <nav class="sidebar-nav">
        <a href="../" class="sidebar-link">
          <span class="icon"><i class="fa-solid fa-chart-simple"></i></span> Dashboard
        </a>
        <a href="../menu-manage/" class="sidebar-link">
          <span class="icon"><i class="fa-solid fa-clipboard-list"></i></span> Menu Management
        </a>
        <a href="../orders/" class="sidebar-link">
          <span class="icon"><i class="fa-solid fa-box"></i></span> Order Management
        </a>
        <a href="../cancellations/" class="sidebar-link">
          <span class="icon"><i class="fa-solid fa-ban" style="color:var(--clr-error);"></i></span> Cancellations
        </a>
        <a href="./" class="sidebar-link active">
          <span class="icon"><i class="fa-solid fa-qrcode"></i></span> QR Codes
        </a>
        <a href="../../kitchen/" class="sidebar-link">
          <span class="icon"><i class="fa-solid fa-kitchen-set"></i></span> Kitchen Display
        </a>
        <a href="../../menu/?t=Takeaway" class="sidebar-link">
          <span class="icon"><i class="fa-solid fa-mobile-screen"></i></span> Customer View
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn--ghost btn--full btn--sm" id="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
      </div>
    </aside>

    <button class="sidebar-toggle" id="sidebar-toggle"><i class="fa-solid fa-bars"></i></button>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="admin-page-header">
        <h1 class="admin-page-title"><i class="fa-solid fa-qrcode"></i> Table & Takeaway QR Codes</h1>
        <button class="btn btn--primary" onclick="window.print()">
          <i class="fa-solid fa-print"></i> Print QRs
        </button>
      </div>

      <style>
        .qr-setup-card {
          display: flex;
          align-items: center;
          justify-content: space-between;
          background: var(--bg-surface);
          padding: var(--sp-4);
          border-radius: var(--radius-lg);
          border: 1px solid var(--border-color);
          margin-bottom: var(--sp-6);
          flex-wrap: wrap;
          gap: var(--sp-4);
        }
        .qr-setup-info {
          flex: 1;
          min-width: 250px;
        }
        .qr-setup-actions {
          display: flex;
          gap: var(--sp-4);
          align-items: flex-end;
          flex-wrap: wrap;
        }
      </style>
      <div class="qr-setup-card">
        <div class="qr-setup-info">
          <h2 style="font-size: var(--fs-md); margin-bottom: var(--sp-1); color: var(--clr-text);">Setup Your Tables</h2>
          <p style="font-size: var(--fs-sm); color: var(--clr-text-muted); margin: 0;">Enter the number of tables in your restaurant to instantly generate high-quality, print-ready QR codes for your customers.</p>
        </div>
        
        <div class="qr-setup-actions">
          <div class="form-group" style="margin-bottom: 0; display: none;">
            <label class="form-label" for="base-url">Website URL (Base)</label>
            <input type="text" class="form-input" id="base-url" placeholder="https://yourwebsite.com">
          </div>
          <div class="form-group" style="margin-bottom: 0; width: 120px;">
            <label class="form-label" for="num-tables">Total Tables</label>
            <input type="number" class="form-input" id="num-tables" value="10" min="1" max="100">
          </div>
          <button class="btn btn--accent" id="generate-btn" style="height: 42px; padding: 0 var(--sp-6);">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Generate
          </button>
        </div>
      </div>

      <div class="qr-grid" id="qr-grid">
        <!-- QRs will be injected here -->
      </div>
    </main>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script>
    if (!sessionStorage.getItem(CONFIG.STORAGE_KEYS.AUTH)) {
      window.location.href = '../login/';
    }

    const qrGrid = document.getElementById('qr-grid');
    const baseUrlInput = document.getElementById('base-url');
    const numTablesInput = document.getElementById('num-tables');
    const generateBtn = document.getElementById('generate-btn');

    // Guess base URL
    let currentUrl = window.location.href;
    let guessedBase = currentUrl.substring(0, currentUrl.indexOf('/admin'));
    baseUrlInput.value = guessedBase;

    async function init() {
      try {
        const config = await API.getConfig();
        if (config && config.num_tables) {
          numTablesInput.value = config.num_tables;
        }
      } catch (e) {
        console.warn('Could not fetch configuration:', e);
      }
      generateQRCodes();
    }

    async function saveAndGenerateQRCodes() {
      const numTables = parseInt(numTablesInput.value) || 10;
      try {
        // Save table count configuration to sheet in real-time
        await API.updateConfig('num_tables', numTables);
        showToast('Table count saved to database!', 'success');
      } catch (e) {
        console.error('Failed to save config:', e);
      }
      generateQRCodes();
    }

    function generateQRCodes() {
      qrGrid.innerHTML = ''; // Clear existing
      let base = baseUrlInput.value.replace(/\/+$/, ''); // Remove trailing slashes
      let numTables = parseInt(numTablesInput.value) || 10;

      // 1. Generate Takeaway QR
      createQRCard('Takeaway', `${base}/menu/?t=Takeaway`, '<i class="fa-solid fa-bag-shopping"></i> Take Away');

      // 2. Generate Table QRs
      for (let i = 1; i <= numTables; i++) {
        createQRCard(`T${i}`, `${base}/menu/?t=${i}`, `Table ${i}`);
      }
    }

    function createQRCard(id, url, title) {
      const card = document.createElement('div');
      card.className = 'qr-card';
      card.innerHTML = `
        <h3>${title}</h3>
        <div class="qr-code" id="qr-${id}"></div>
        <div style="display: none;">${url}</div>
      `;
      qrGrid.appendChild(card);

      new QRCode(document.getElementById(`qr-${id}`), {
        text: url,
        width: 150,
        height: 150,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });
    }

    generateBtn.addEventListener('click', saveAndGenerateQRCodes);
    
    // Also save config automatically on input change or blur
    numTablesInput.addEventListener('change', async () => {
      const numTables = parseInt(numTablesInput.value) || 10;
      try {
        await API.updateConfig('num_tables', numTables);
      } catch (e) {
        console.error('Failed to save config on change:', e);
      }
    });

    const sidebar = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebar-backdrop');
    function toggleSidebar() {
      sidebar.classList.toggle('open');
      sidebarBackdrop.classList.toggle('active');
    }
    document.getElementById('sidebar-toggle').addEventListener('click', toggleSidebar);
    sidebarBackdrop.addEventListener('click', toggleSidebar);
    document.getElementById('logout-btn').addEventListener('click', () => {
      sessionStorage.clear();
      window.location.href = '../login/';
    });

    // Run initialization
    init();
  </script>
<script src="../../js/notifications.js"></script>
</body>
</html>
