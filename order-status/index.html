<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Track your order status in real-time.">
  <meta name="theme-color" content="#0f1117">
  <title>Order Status — Tracking</title>

  <!-- PWA Meta Tags & Manifest -->

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WIN Restaurant">
  <link rel="apple-touch-icon" href="../icons/icon-512.png">

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/ads.css">
  <link rel="stylesheet" href="../css/payment.css">
  <style>
    .status-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--sp-8) var(--sp-4);
    }

    .status-card {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* Success checkmark */
    .success-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto var(--sp-6);
      background: linear-gradient(135deg, var(--clr-success), hsl(152, 70%, 35%));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      animation: scaleIn 500ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      box-shadow: 0 0 30px hsla(152, 70%, 45%, 0.3);
    }

    .order-title {
      font-family: var(--font-heading);
      font-size: var(--fs-3xl);
      margin-bottom: var(--sp-2);
      background: linear-gradient(135deg, var(--clr-primary-300), var(--clr-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .order-id-display {
      font-size: var(--fs-lg);
      font-weight: var(--fw-semibold);
      color: var(--clr-text-secondary);
      margin-bottom: var(--sp-2);
    }

    .order-table-info {
      font-size: var(--fs-sm);
      color: var(--clr-text-muted);
      margin-bottom: var(--sp-8);
    }

    /* ── Progress Stepper ── */
    .stepper {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: var(--sp-8);
      position: relative;
      padding: 0;
    }

    .stepper-line {
      position: absolute;
      top: 20px;
      left: 10%;
      right: 10%;
      height: 3px;
      background: var(--clr-border);
      z-index: 0;
    }
    .stepper-line-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--clr-success), var(--clr-primary));
      border-radius: 2px;
      transition: width 800ms ease;
      width: 0%;
    }

    .stepper-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-2);
      position: relative;
      z-index: 1;
      flex: 1;
    }

    .stepper-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--clr-bg-elevated);
      border: 3px solid var(--clr-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--fs-lg);
      transition: all var(--transition-slow);
    }
    .stepper-step.completed .stepper-circle {
      background: var(--clr-success);
      border-color: var(--clr-success);
      box-shadow: 0 0 12px hsla(152, 70%, 45%, 0.4);
    }
    .stepper-step.active .stepper-circle {
      background: var(--clr-primary);
      border-color: var(--clr-primary);
      box-shadow: 0 0 16px hsla(36, 95%, 50%, 0.4);
      animation: pulse 1.5s infinite;
    }

    .stepper-label {
      font-size: var(--fs-xs);
      font-weight: var(--fw-medium);
      color: var(--clr-text-muted);
      text-align: center;
      max-width: 70px;
      transition: color var(--transition-base);
    }
    .stepper-step.completed .stepper-label,
    .stepper-step.active .stepper-label {
      color: var(--clr-text-primary);
      font-weight: var(--fw-semibold);
    }

    /* ── Order Items List ── */
    .order-items-card {
      background: var(--clr-bg-card);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-lg);
      padding: var(--sp-6);
      margin-bottom: var(--sp-6);
      text-align: left;
    }

    .order-items-title {
      font-family: var(--font-body);
      font-size: var(--fs-md);
      font-weight: var(--fw-bold);
      margin-bottom: var(--sp-4);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }

    .order-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--sp-3) 0;
      border-bottom: 1px solid var(--clr-border);
      font-size: var(--fs-base);
    }
    .order-item-row:last-child {
      border-bottom: none;
    }

    .order-item-name {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }
    .order-item-qty {
      background: var(--clr-bg-elevated);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: var(--fs-xs);
      font-weight: var(--fw-bold);
      color: var(--clr-primary-400);
    }

    .order-item-price {
      font-weight: var(--fw-semibold);
      color: var(--clr-text-secondary);
    }

    .order-total-row {
      display: flex;
      justify-content: space-between;
      padding-top: var(--sp-4);
      margin-top: var(--sp-2);
      border-top: 2px solid var(--clr-border);
      font-size: var(--fs-lg);
      font-weight: var(--fw-bold);
    }
    .order-total-amount {
      color: var(--clr-primary-400);
    }

    .order-notes-display {
      margin-top: var(--sp-4);
      padding: var(--sp-3);
      background: var(--clr-bg-elevated);
      border-radius: var(--radius-md);
      font-size: var(--fs-sm);
      color: var(--clr-text-muted);
      font-style: italic;
    }

    /* ── Status Message ── */
    .status-message {
      padding: var(--sp-4) var(--sp-6);
      background: var(--clr-bg-card);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-lg);
      margin-bottom: var(--sp-6);
      text-align: center;
    }
    .status-message .emoji {
      font-size: 2rem;
      margin-bottom: var(--sp-2);
    }
    .status-message .text {
      font-size: var(--fs-base);
      color: var(--clr-text-secondary);
    }

    /* ── Action buttons ── */
    .status-actions {
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      width: 100%;
    }

    /* ── Auto-refresh indicator ── */
    .refresh-indicator {
      font-size: var(--fs-xs);
      color: var(--clr-text-muted);
      text-align: center;
      margin-top: var(--sp-4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
    }
    .refresh-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--clr-success);
      animation: pulse 2s infinite;
    }

    /* Rejected state */
    .rejected-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto var(--sp-6);
      background: linear-gradient(135deg, var(--clr-error), hsl(0, 75%, 40%));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      animation: scaleIn 500ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      box-shadow: 0 0 30px hsla(0, 75%, 55%, 0.3);
    }

    /* Confetti canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: var(--z-toast);
    }
    /* Cancelled state */
    .cancel-redirect-countdown {
      font-size: var(--fs-sm);
      color: var(--clr-text-muted);
      text-align: center;
      margin-top: var(--sp-4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      animation: pulse 1.5s infinite;
    }

    /* Cancellation Pending State */
    .cancellation-pending-state {
      text-align: center;
      padding: var(--sp-5) var(--sp-4);
      background: hsla(25, 90%, 50%, 0.06);
      border: 1.5px solid hsla(25, 90%, 50%, 0.3);
      border-radius: var(--radius-lg);
      margin-bottom: var(--sp-4);
      animation: slideUp 400ms ease;
    }
    .cancel-pending-icon {
      font-size: 2.2rem;
      color: hsl(25, 90%, 55%);
      margin-bottom: var(--sp-3);
    }
    .cancel-pending-title {
      font-size: var(--fs-md);
      font-weight: var(--fw-bold);
      color: hsl(25, 90%, 65%);
      margin-bottom: var(--sp-2);
    }
    .cancel-pending-text {
      font-size: var(--fs-sm);
      color: var(--clr-text-muted);
      line-height: 1.6;
    }

    /* Request Cancellation Form Box */
    .cancel-request-form-box {
      background: var(--clr-bg-elevated);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-lg);
      padding: var(--sp-4);
      margin-bottom: var(--sp-4);
      text-align: left;
      animation: slideUp 350ms ease;
    }
    .cancel-request-form-title {
      font-size: var(--fs-sm);
      font-weight: var(--fw-bold);
      color: hsl(25, 90%, 60%);
      margin-bottom: var(--sp-2);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }
    @keyframes slideUp {
      from { opacity:0; transform: translateY(10px); }
      to   { opacity:1; transform: translateY(0); }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="status-page">
    <div class="status-card" id="status-card">
      <!-- Loading state -->
      <div id="status-loading" style="padding: 4rem 0;">
        <div class="spinner spinner--lg" style="margin: 0 auto;"></div>
        <p style="margin-top: 1rem; color: var(--clr-text-muted);">Loading order...</p>
      </div>

      <!-- Order content (hidden until loaded) -->
      <div id="status-content" style="display: none;">
        <div id="status-icon-area"></div>

        <h1 class="order-title" id="status-title">Order Placed!</h1>
        <div class="order-id-display" id="order-id-display">Order #---</div>
        <div class="order-table-info" id="order-table-info" style="margin-bottom: 4px;">Table ---</div>
        <div class="order-customer-info" id="order-customer-info" style="font-size: var(--fs-xs); color: var(--clr-text-muted); margin-bottom: var(--sp-6); display: none;"></div>

        <!-- Stepper -->
        <div class="stepper" id="stepper">
          <div class="stepper-line">
            <div class="stepper-line-fill" id="stepper-fill"></div>
          </div>
          <div class="stepper-step" data-status="New">
            <div class="stepper-circle"><i class="fa-solid fa-file-signature"></i></div>
            <span class="stepper-label">Placed</span>
          </div>
          <div class="stepper-step" data-status="Accepted">
            <div class="stepper-circle"><i class="fa-solid fa-circle-check"></i></div>
            <span class="stepper-label">Accepted</span>
          </div>
          <div class="stepper-step" data-status="Preparing">
            <div class="stepper-circle"><i class="fa-solid fa-kitchen-set"></i></div>
            <span class="stepper-label">Preparing</span>
          </div>
          <div class="stepper-step" data-status="Ready">
            <div class="stepper-circle"><i class="fa-solid fa-bell"></i></div>
            <span class="stepper-label">Ready</span>
          </div>
          <div class="stepper-step" data-status="Delivered">
            <div class="stepper-circle"><i class="fa-solid fa-champagne-glasses"></i></div>
            <span class="stepper-label">Delivered</span>
          </div>
        </div>

        <!-- Status message -->
        <div class="status-message" id="status-message">
          <div class="emoji"><i class="fa-solid fa-hourglass-half"></i></div>
          <div class="text">Your order has been received!</div>
        </div>

        <!-- Ad Placement: Order Tracking / Waiting -->
        <div id="status-ad-container" style="width:100%; margin-bottom:var(--sp-6); display:none;"></div>



        <!-- Order items / Digital Bill -->
        <div class="order-items-card" id="order-items-card" style="position: relative; border: 1px dashed var(--clr-border-light); background: linear-gradient(to bottom, var(--clr-bg-card), var(--clr-bg-elevated));">
          <div class="order-items-title" style="justify-content: space-between;">
            <span><i class="fa-solid fa-receipt"></i> Digital Bill / Receipt</span>
            <span style="font-size: var(--fs-xs); color: var(--clr-text-muted);" id="bill-date"></span>
          </div>
          <div id="order-items-list"></div>
          <div class="order-total-row">
            <span>Grand Total</span>
            <span class="order-total-amount" id="order-total">₹0</span>
          </div>
          <div class="order-notes-display" id="order-notes-display" style="display:none;"></div>
        </div>

        <!-- Ad Placement: Bill / Receipt Page -->
        <div id="bill-ad-container" style="width:100%; margin-bottom:var(--sp-6); display:none;"></div>

        <!-- Cancel Order area (customer view) -->
        <div id="cancel-order-area" style="margin-bottom: var(--sp-4);"></div>

        <!-- Cancellation Info (shown when order is cancelled) -->
        <div id="cancellation-info-area" style="margin-bottom: var(--sp-4);"></div>

        <!-- Actions -->
        <div class="status-actions">
          <a href="../menu/" class="btn btn--outline btn--full" id="order-again-btn">
            <i class="fa-solid fa-utensils"></i> Order More
          </a>
        </div>

        <div class="refresh-indicator" id="refresh-indicator">
          <span class="refresh-dot"></span>
          Auto-refreshing every 5 seconds
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ads.js"></script>
  <script src="../js/cancellation.js"></script>
  <script src="../js/order-status.js"></script>
  <script>
    /* All cancel / request-cancel logic is now handled by order-status.js renderOrder(). */
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js', { scope: '../' })
          .then(reg => console.log('Service Worker registered successfully.', reg.scope))
          .catch(err => console.log('Service Worker registration failed.', err));
      });
    }
  </script>
</body>
</html>
