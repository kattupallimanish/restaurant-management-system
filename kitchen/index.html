<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kitchen display board showing real-time customer orders in Kanban columns.">
  <meta name="theme-color" content="#0f1117">
  <title>Kitchen Display — Admin Panel</title>

  <!-- PWA Meta Tags & Manifest -->
  <link rel="manifest" href="../manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WIN Restaurant">
  <link rel="apple-touch-icon" href="../icons/icon-512.png">

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/kitchen.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="kitchen-layout">
    <!-- Header -->
    <header class="kitchen-header">
      <div class="kitchen-title">
        <span class="kitchen-logo"><i class="fa-solid fa-kitchen-set"></i></span>
        <div>
          <h1 style="font-family: var(--font-body); font-size: var(--fs-xl); font-weight: var(--fw-bold); margin: 0;">Kitchen Display</h1>
          <span style="font-size: var(--fs-xs); color: var(--clr-text-muted);" id="kitchen-restaurant-name">WIN Restaurant</span>
        </div>
      </div>

      <div class="kitchen-info">
        <!-- Audio alert toggle -->
        <label class="audio-toggle">
          <input type="checkbox" id="audio-enabled" checked>
          <span class="audio-toggle-btn"></span>
          <span style="color: var(--clr-text-secondary); font-weight: var(--fw-medium);">Sound Alerts</span>
        </label>

        <!-- Current time -->
        <div class="kitchen-time" id="kitchen-clock">00:00:00</div>
        
        <!-- Back button -->
        <a href="../admin/" class="btn btn--outline btn--sm">← Dashboard</a>
      </div>
    </header>

    <!-- Waiter Calls -->
    <div id="waiter-calls-container" style="display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-4) var(--sp-4) 0 var(--sp-4);"></div>

    <!-- Kanban Board -->
    <main class="kitchen-board">
      
      <!-- COLUMN 1: NEW -->
      <section class="kitchen-col" id="col-new">
        <div class="kitchen-col-header col-new">
          <span><i class="fa-solid fa-clipboard-list"></i> New Orders</span>
          <span class="kitchen-col-count" id="count-new">0</span>
        </div>
        <div class="kitchen-col-cards" id="cards-new">
          <!-- Dynamically filled -->
        </div>
      </section>

      <!-- COLUMN 2: PREPARING -->
      <section class="kitchen-col" id="col-preparing">
        <div class="kitchen-col-header col-preparing">
          <span><i class="fa-solid fa-egg"></i> Preparing</span>
          <span class="kitchen-col-count" id="count-preparing">0</span>
        </div>
        <div class="kitchen-col-cards" id="cards-preparing">
          <!-- Dynamically filled -->
        </div>
      </section>

      <!-- COLUMN 3: READY -->
      <section class="kitchen-col" id="col-ready">
        <div class="kitchen-col-header col-ready">
          <span><i class="fa-solid fa-bell"></i> Ready for Pickup</span>
          <span class="kitchen-col-count" id="count-ready">0</span>
        </div>
        <div class="kitchen-col-cards" id="cards-ready">
          <!-- Dynamically filled -->
        </div>
      </section>

      <!-- COLUMN 4: SERVED / UNPAID -->
      <section class="kitchen-col" id="col-delivered">
        <div class="kitchen-col-header col-delivered">
          <span><i class="fa-solid fa-handshake"></i> Served (Unpaid)</span>
          <span class="kitchen-col-count" id="count-delivered">0</span>
        </div>
        <div class="kitchen-col-cards" id="cards-delivered">
          <!-- Dynamically filled -->
        </div>
      </section>

    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script>
    // ── Auth guard ──
    if (!sessionStorage.getItem(CONFIG.STORAGE_KEYS.AUTH)) {
      window.location.href = '../admin/login/';
    }

    // ── State ──
    let orders = [];
    let knownOrderIds = new Set();
    let isInitialLoad = true;

    // ── DOM Elements ──
    const clockEl = document.getElementById('kitchen-clock');
    const restaurantNameEl = document.getElementById('kitchen-restaurant-name');
    const audioEnabledInput = document.getElementById('audio-enabled');
    
    const countNew = document.getElementById('count-new');
    const countPreparing = document.getElementById('count-preparing');
    const countReady = document.getElementById('count-ready');
    const countDelivered = document.getElementById('count-delivered');

    const cardsNew = document.getElementById('cards-new');
    const cardsPreparing = document.getElementById('cards-preparing');
    const cardsReady = document.getElementById('cards-ready');
    const cardsDelivered = document.getElementById('cards-delivered');

    // ── Clock ──
    function updateClock() {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ── Init ──
    async function init() {
      // Set restaurant name
      const name = sessionStorage.getItem('restaurant_name') || 'WIN Restaurant';
      restaurantNameEl.textContent = name;

      await Promise.all([loadOrders(), loadWaiterCalls()]);
      isInitialLoad = false;

      // Auto refresh every 5 seconds
      setInterval(() => {
        loadOrders();
        loadWaiterCalls();
      }, CONFIG.POLL_INTERVAL);
    }

    let previousWaiterCalls = 0;

    async function loadWaiterCalls() {
      try {
        const calls = await API.getWaiterCalls();
        const container = document.getElementById('waiter-calls-container');
        
        if (calls.length > previousWaiterCalls) {
          playNotificationChime();
          showToast('Table needs a Waiter!', 'warning');
        }
        previousWaiterCalls = calls.length;

        if (calls.length === 0) {
          container.innerHTML = '';
          return;
        }
        
        container.innerHTML = calls.map(call => `
          <div style="background: var(--clr-error); color: white; padding: var(--sp-3); border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-family: var(--font-body);">
            <span><i class="fa-solid fa-bell fa-shake"></i> Table ${call.table} called for a Waiter!</span>
            <button class="btn btn--sm" style="background: white; color: var(--clr-error);" onclick="resolveWaiterCall('${call.table}')">Acknowledge</button>
          </div>
        `).join('');
      } catch (err) {
        console.warn('Could not fetch waiter calls');
      }
    }

    window.resolveWaiterCall = async function(id) {
      try {
        await API.resolveWaiterCall(id);
        loadWaiterCalls();
      } catch (err) {
        showToast('Failed to resolve call', 'error');
      }
    };

    // ── Audio Alert (Web Audio API) ──
    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.error("AudioContext initialization failed:", e);
      }
    }

    // Unlock Audio Context on first user interaction
    window.addEventListener('click', initAudio, { once: true });
    window.addEventListener('touchstart', initAudio, { once: true });
    window.addEventListener('keydown', initAudio, { once: true });

    function playNotificationChime() {
      if (!audioEnabledInput.checked) return;
      try {
        initAudio();
        if (!audioCtx) return;
        
        // Tone 1: D5
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
        gain1.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start();
        osc1.stop(audioCtx.currentTime + 0.35);

        // Tone 2: A5
        setTimeout(() => {
          if (audioCtx.state === 'closed') return;
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880, audioCtx.currentTime); 
          gain2.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          osc2.start();
          osc2.stop(audioCtx.currentTime + 0.45);
        }, 150);
      } catch (e) {
        console.error("Web Audio Alert failed:", e);
      }
    }

    // ── Load Orders ──
    async function loadOrders() {
      try {
        orders = await API.getOrders();
        processOrders();
      } catch (err) {
        console.warn('Could not fetch kitchen orders. Showing mock data.');
        if (isInitialLoad) {
          orders = [
            { orderId: 'M249', table: 'T1', customerName: 'Manish', mobileNumber: '9876543210', items: [{name: 'Margherita Pizza', qty: 2}, {name: 'Cold Coffee', qty: 1}], total: 727, status: 'New', timestamp: new Date().toISOString(), notes: 'No onions' },
            { orderId: 'K603', table: 'T3', customerName: 'Ravi', mobileNumber: '9988776655', items: [{name: 'Veg Burger', qty: 1}], total: 149, status: 'Preparing', timestamp: new Date(Date.now() - 300000).toISOString(), notes: '' },
            { orderId: 'A094', table: 'T5', customerName: 'Sita', mobileNumber: '9848022338', items: [{name: 'Farmhouse Pizza', qty: 1}], total: 349, status: 'Ready', timestamp: new Date(Date.now() - 600000).toISOString(), notes: 'Extra hot' }
          ];
          processOrders();
        }
      }
    }

    function processOrders() {
      let hasNewOrder = false;

      // Filter out Paid and Rejected orders
      const activeOrders = orders.filter(o => o.status !== 'Paid' && o.status !== 'Rejected');

      // Check for new orders to alert
      activeOrders.forEach(o => {
        if (!knownOrderIds.has(o.orderId)) {
          knownOrderIds.add(o.orderId);
          if (!isInitialLoad && o.status === 'New') {
            hasNewOrder = true;
          }
        }
      });

      if (hasNewOrder) {
        playNotificationChime();
        showToast('New order received!', 'info');
      }

      renderColumns(activeOrders);
    }

    function renderColumns(activeOrders) {
      const newOrders = activeOrders.filter(o => o.status === 'New');
      const preparingOrders = activeOrders.filter(o => o.status === 'Accepted' || o.status === 'Preparing');
      const readyOrders = activeOrders.filter(o => o.status === 'Ready');
      const deliveredOrders = activeOrders.filter(o => o.status === 'Delivered');

      // Update counters
      countNew.textContent = newOrders.length;
      countPreparing.textContent = preparingOrders.length;
      countReady.textContent = readyOrders.length;
      if (countDelivered) countDelivered.textContent = deliveredOrders.length;

      // Render cards
      cardsNew.innerHTML = renderCardsList(newOrders, 'New');
      cardsPreparing.innerHTML = renderCardsList(preparingOrders, 'Preparing');
      cardsReady.innerHTML = renderCardsList(readyOrders, 'Ready');
      if (cardsDelivered) cardsDelivered.innerHTML = renderCardsList(deliveredOrders, 'Delivered');

      // Add event listeners for status updates
      document.querySelectorAll('.kitchen-action-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const orderId = btn.dataset.order;
          const nextStatus = btn.dataset.status;
          btn.disabled = true;
          btn.textContent = '...';

          try {
            await API.updateOrderStatus(orderId, nextStatus);
            showToast(`Order ${orderId} moved to ${nextStatus}`, 'success');
            await loadOrders();
          } catch (err) {
            showToast('Failed to update status', 'error');
            btn.disabled = false;
          }
        });
      });
    }

    function renderCardsList(orderList, columnType) {
      if (orderList.length === 0) {
        return `<div style="text-align: center; padding: 2rem; color: var(--clr-text-muted); font-size: var(--fs-sm);">No orders</div>`;
      }

      return orderList.map(order => {
        const items = order.items || [];
        const elapsedMinutes = Math.floor((Date.now() - new Date(order.timestamp)) / 60000);
        const timeDisplay = elapsedMinutes <= 0 ? 'Just now' : `${elapsedMinutes}m ago`;
        
        let actionBtnHtml = '';
        if (order.status === 'New') {
          actionBtnHtml = `
            <button class="btn btn--primary btn--sm kitchen-action-btn" data-order="${order.orderId}" data-status="Accepted"><i class="fa-solid fa-kitchen-set"></i> Accept</button>
            <button class="btn btn--ghost btn--sm kitchen-action-btn" data-order="${order.orderId}" data-status="Rejected" style="color:var(--clr-error);">✖ Reject</button>
          `;
        } else if (order.status === 'Accepted' || order.status === 'Preparing') {
          actionBtnHtml = `
            <button class="btn btn--primary btn--sm kitchen-action-btn" data-order="${order.orderId}" data-status="Ready" style="background-color: var(--clr-success); border-color: var(--clr-success);"><i class="fa-solid fa-bell"></i> Ready</button>
          `;
        } else if (order.status === 'Ready') {
          actionBtnHtml = `
            <button class="btn btn--primary btn--sm kitchen-action-btn" data-order="${order.orderId}" data-status="Delivered"><i class="fa-solid fa-champagne-glasses"></i> Serve</button>
          `;
        } else if (order.status === 'Delivered') {
          actionBtnHtml = `
            <button class="btn btn--primary btn--sm kitchen-action-btn" data-order="${order.orderId}" data-status="Paid" style="background-color: var(--clr-success); border-color: var(--clr-success);"><i class="fa-solid fa-credit-card"></i> Mark Paid</button>
          `;
        }

        const borderClass = `status-${columnType.toLowerCase()}`;

        return `
          <div class="kitchen-card ${borderClass}">
            <div class="kitchen-card-header">
              <span class="kitchen-card-id">${order.orderId}</span>
              <span class="kitchen-card-table"><i class="fa-solid fa-chair"></i> Table ${order.table}</span>
            </div>
            ${(order.customerName || order.mobileNumber) ? `<div style="font-size: var(--fs-xs); color: var(--clr-text-secondary); margin-bottom: var(--sp-1); margin-top: -2px;"><i class="fa-solid fa-user"></i> ${order.customerName || 'Guest'} (${order.mobileNumber || ''})</div>` : ''}
            
            <ul class="kitchen-card-items">
              ${items.map(item => `
                <li class="kitchen-card-item">
                  <span><span class="kitchen-card-qty">${item.qty}×</span>${item.name}</span>
                </li>
              `).join('')}
            </ul>

            ${order.notes ? `<div class="kitchen-card-notes"><i class="fa-solid fa-file-signature"></i> ${order.notes}</div>` : ''}

            <div class="kitchen-card-footer">
              <span class="kitchen-card-time"><i class="fa-solid fa-hourglass-half"></i> ${timeDisplay} (${formatTime(order.timestamp)})</span>
              <div class="kitchen-card-actions">
                ${actionBtnHtml}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js', { scope: '../' })
          .then(reg => console.log('Service Worker registered successfully.', reg.scope))
          .catch(err => console.log('Service Worker registration failed.', err));
      });
    }
  </script>
<script src="../../js/notifications.js"></script>
</body>
</html>
